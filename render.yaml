services:
  - type: web
    name: reverse-draw
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /livez
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL     # Supabase "Session pooler" connection string
        sync: false
      - key: RELATIONAL_STORE_ENABLED
        value: "false"
      - key: ACTIVE_DRAW_ID
        value: ""
      - key: REQUIRE_DATABASE_IN_PRODUCTION
        value: "true"
      - key: MAINTENANCE_MODE
        value: "false"
      - key: OPERATIONAL_STALE_JOB_SECONDS
        value: "1800"
      - key: OPERATIONAL_READINESS_MAX_QUERY_MS
        value: "2000"
      - key: DATABASE_POOL_MIN
        value: "1"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "3"
      - key: DATABASE_POOL_STARTUP_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_LOCK_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_IDLE_TRANSACTION_TIMEOUT_MS
        value: "10000"
      - key: TRADING_ENABLED
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_ACCESS_CODE
        sync: false
      - key: TRADING_MIN_PRICE_CENTS
        value: "100"
      - key: TRADING_MAX_PRICE_CENTS
        value: "10000000"
      - key: TRADING_REQUEST_TTL_SECONDS
        value: "86400"
      - key: TRADING_POLL_SECONDS
        value: "15"
      - key: TRADING_POLL_JITTER_PERCENT
        value: "20"
      - key: TRADING_POLL_MAX_BACKOFF_SECONDS
        value: "120"
      - key: TRADING_MARKET_CACHE_SECONDS
        value: "1.5"
      - key: TRADING_HISTORY_LIMIT
        value: "50"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_SENDER_ADDRESS
        sync: false
      - key: EMAIL_SENDER_NAME
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
