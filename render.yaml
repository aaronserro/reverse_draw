services:
  - type: web
    name: reverse-draw
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL     # Supabase "Session pooler" connection string
        sync: false
      - key: RELATIONAL_STORE_ENABLED
        value: "false"
      - key: ACTIVE_DRAW_ID
        value: ""
      - key: REQUIRE_DATABASE_IN_PRODUCTION
        value: "true"
      - key: MAINTENANCE_MODE
        value: "false"
      - key: OPERATIONAL_STALE_JOB_SECONDS
        value: "1800"
      - key: TRADING_ENABLED
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_ACCESS_CODE
        sync: false
      - key: TRADING_MIN_PRICE_CENTS
        value: "100"
      - key: TRADING_MAX_PRICE_CENTS
        value: "10000000"
      - key: TRADING_REQUEST_TTL_SECONDS
        value: "86400"
      - key: TRADING_POLL_SECONDS
        value: "5"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_SENDER_ADDRESS
        sync: false
      - key: EMAIL_SENDER_NAME
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
